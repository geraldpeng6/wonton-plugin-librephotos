# 上游镜像发新版时开 PR，标签和摘要一起改；PR 跑插件自己的检查。
version: 2
updates:
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily
    # 数据库大版本由 pgautoupgrade 自己在启动时升级，dependabot 不跨大版本动它
    ignore:
      - dependency-name: "pgautoupgrade/pgautoupgrade"
        update-types: ["version-update:semver-major"]
